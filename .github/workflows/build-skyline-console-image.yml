name: Build Skyline Console Image

on:
  push:
    branches:
      - magnum-flavor-name-fix
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/skyline-console
  IMAGE_TAG: magnum-flavor-name-fix
  KOLLA_SKYLINE_CONSOLE_IMAGE: quay.io/openstack.kolla/skyline-console:master-ubuntu-noble

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: yarn

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Skyline Console source archive
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --non-interactive
          rm -rf skyline_console/static dist
          yarn run build
          echo "${GITHUB_SHA}" > skyline_console/static/commit_id.txt
          python -m pip install --upgrade build
          python -m build --sdist
          mkdir -p .image-build-context
          cp dist/*.tar.gz .image-build-context/skyline-console.tar.gz

      - name: Set image tags
        id: meta
        run: |
          image_name="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deployment is intentionally separate. In Kolla, override:
      # skyline_console_image_full: "ghcr.io/<owner>/<repo>/skyline-console:magnum-flavor-name-fix"
      # Then run a targeted Skyline reconfigure through Kolla-Ansible.
      - name: Build and push Skyline Console image
        uses: docker/build-push-action@v6
        with:
          context: .image-build-context
          file: .github/docker/skyline-console/Dockerfile
          push: true
          build-args: |
            KOLLA_SKYLINE_CONSOLE_IMAGE=${{ env.KOLLA_SKYLINE_CONSOLE_IMAGE }}
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.sha_tag }}
