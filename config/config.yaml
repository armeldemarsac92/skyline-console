host: 0.0.0.0
port: 8088
server: http://localhost

theme: default

globalVariables:
  magnumDriverMappings:
    RegionOne:
      - server_type: vm
        cluster_distro: ubuntu
        coe: kubernetes
        driver: k8s_capi_helm_v1
  defaultLanguage: en
  supportLanguages: # use value in i18n.js
    - en
    - zh-hans
    - ko-kr
    - tr-tr
    - ru
    - de
